<!DOCTYPE html>
<html>
<!-- INFO -->
<head>
    <meta charset="utf-8">
    <title><!-- TITLE --></title>
    <!-- META -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // What the reader's progress, saved games and choices are kept under in the browser:
        // squiffy.json's id, so they're kept wherever the story is put, or else the page's address
        window.squiffyStorageKey = /* STORAGE_KEY */;

        // Applies the reader's light or dark choice from the theme button before the page is shown
        try {
            const themeKey = 'squiffy-theme:' + window.squiffyStorageKey;
            // A choice made when it was kept by the page's address
            const oldThemeKey = 'squiffy-theme:' + window.location.pathname;
            if (oldThemeKey !== themeKey && localStorage.getItem(oldThemeKey) !== null) {
                if (localStorage.getItem(themeKey) === null) localStorage.setItem(themeKey, localStorage.getItem(oldThemeKey));
                localStorage.removeItem(oldThemeKey);
            }
            const theme = localStorage.getItem(themeKey);
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.squiffyTheme = theme;
        } catch (e) {
            // Storage can be unavailable, e.g. in a private window
        }
    </script>
    <!-- SCRIPTS -->
    <!-- STYLE_CONTENT -->
    <!-- RUNTIME_CONTENT -->
    <!-- STORY_CONTENT -->
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const pageStrings = /* PAGE_STRINGS */;

            const squiffyApi = await squiffyRuntime.init({
                element: document.getElementById('squiffy'),
                story: story,
                persist: true,
                strings: pageStrings,
                /* ASSET_OPTIONS */
            });

            // The Restart button, and {{restart}} links in the story (#452), which can skip the question
            const askRestart = async function (ask) {
                if (ask && !await squiffyRuntime.confirmDialog({
                    message: pageStrings.restartConfirm,
                    confirm: pageStrings.restart,
                    cancel: pageStrings.cancel,
                })) return;
                squiffyApi.restart();
            };
            document.getElementById('restart').addEventListener('click', function () {
                askRestart(true);
            });
            squiffyApi.on('restartRequested', function (event) {
                askRestart(event.confirm);
            });

            // The Back button, unless the story's squiffy.json turns it off
            const backButton = document.getElementById('squiffy-back');
            if (backButton) {
                backButton.addEventListener('click', function () {
                    squiffyApi.goBack();
                });
                squiffyApi.on('canGoBackChanged', function (event) {
                    backButton.disabled = !event.canGoBack;
                });
            }

            // The Saved games dialog, opened by the Save button (unless the story's squiffy.json
            // turns it off) and by {{saves}} links in the story (#452)
            let savesDialog = null;
            const openSaves = function () {
                if (!savesDialog) {
                    savesDialog = squiffyRuntime.createSavesDialog(squiffyApi, {
                        strings: pageStrings,
                        key: window.squiffyStorageKey,
                    });
                }
                savesDialog.open();
            };
            const savesButton = document.getElementById('squiffy-saves-button');
            if (savesButton) savesButton.addEventListener('click', openSaves);
            squiffyApi.on('savesRequested', openSaves);

            // The Settings dialog (#452), for a story with "settings" in its squiffy.json: opened by
            // the Settings button and by {{settings}} links in the story
            let settingsDialog = null;
            const openSettings = function () {
                if (!settingsDialog) {
                    settingsDialog = squiffyRuntime.createSettingsDialog(squiffyApi, {
                        strings: pageStrings,
                    });
                }
                settingsDialog.open();
            };
            const settingsButton = document.getElementById('squiffy-settings-button');
            settingsButton.hidden = !(story.settings && story.settings.length);
            settingsButton.addEventListener('click', openSettings);
            squiffyApi.on('settingsRequested', openSettings);

            // The story's panels, from its squiffy.json: beside the story, or buttons in the header
            if (story.panels && story.panels.length) {
                squiffyRuntime.createPanels(squiffyApi, {
                    panels: story.panels,
                    buttons: document.getElementById('squiffy-header'),
                    side: document.getElementById('squiffy-container'),
                    strings: pageStrings,
                });
            }

            // The mute button (#444), shown if the story has music or sounds. Whether it's muted
            // is remembered for the story.
            const muteButton = document.getElementById('squiffy-mute');
            const updateMute = function () {
                const muted = squiffyApi.isMuted();
                muteButton.hidden = !squiffyApi.usesSound();
                muteButton.title = muted ? muteButton.dataset.unmute : muteButton.dataset.mute;
                muteButton.setAttribute('aria-label', muteButton.title);
                muteButton.classList.toggle('squiffy-muted', muted);
            };
            muteButton.addEventListener('click', function () {
                squiffyApi.setMuted(!squiffyApi.isMuted());
                updateMute();
            });
            squiffyApi.on('sound', updateMute);
            updateMute();

            // For testing the story: "?start=section" on the address starts there, and the Start at
            // menu lists the sections. Only in the page the CLI's --serve shows, and in a story
            // whose squiffy.json has "startAnywhere": true. Not in the editor's Play in a new tab,
            // whose blob: address can't have a "?start=" (the editor's preview has a Start at menu
            // of its own).
            let startAt;
            if (/* START_ANYWHERE */ && window.location.protocol !== 'blob:') {
                startAt = squiffyRuntime.createStartMenu({
                    story: story,
                    buttons: document.getElementById('squiffy-header'),
                    strings: pageStrings,
                }).startAt;
            }

            // The title at the left of the header: the story's @title, if its squiffy.json has
            // "headerTitle": true, or whatever the story sets with the headertitle helper
            const headerTitle = document.getElementById('squiffy-header-title');
            const showHeaderTitle = function (title) {
                headerTitle.textContent = title;
                headerTitle.hidden = !title;
            };
            showHeaderTitle(squiffyApi.headerTitle());
            squiffyApi.on('headerTitleChanged', function (event) {
                showHeaderTitle(event.title);
            });

            await squiffyApi.begin(startAt);
            showHeaderTitle(squiffyApi.headerTitle());
            // A saved game may have somewhere to go back to
            if (backButton) backButton.disabled = !squiffyApi.canGoBack();
        });
    </script>
    <!-- STYLESHEETS -->
</head>
<body>
<div id="squiffy-container">
    <div id="squiffy-header">
        <span id="squiffy-header-title" hidden></span>
        <!-- BACK_BUTTON -->
        <button class="squiffy-header-button" id="squiffy-back" type="button" title="{{back}}" aria-label="{{back}}" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <!-- /BACK_BUTTON -->
        <!-- SAVE_BUTTON -->
        <button class="squiffy-header-button" id="squiffy-saves-button" type="button" title="{{saves}}" aria-label="{{saves}}" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
        </button>
        <!-- /SAVE_BUTTON -->
        <button class="squiffy-header-button" id="restart" type="button" title="{{restart}}" aria-label="{{restart}}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="squiffy-header-button" id="squiffy-settings-button" type="button" title="{{settings}}" aria-label="{{settings}}" aria-haspopup="dialog" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="squiffy-header-button" id="squiffy-mute" type="button" data-mute="{{mute}}" data-unmute="{{unmute}}" hidden>
            <svg class="squiffy-icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
            <svg class="squiffy-icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        </button>
        <button class="squiffy-header-button" id="squiffy-theme" type="button" data-switch-to-dark="{{switchToDark}}" data-switch-to-light="{{switchToLight}}">
            <svg class="squiffy-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="squiffy-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
    <div id="squiffy">
    </div>
</div>
<script>
    // The light/dark button. It follows the system setting until the reader chooses, and their
    // choice is remembered for this story. This script is after the stylesheets, so it runs once
    // they've loaded and can see whether the story's own CSS fixes the theme.
    (function () {
        const root = document.documentElement;
        const button = document.getElementById('squiffy-theme');
        const key = 'squiffy-theme:' + window.squiffyStorageKey;
        const system = window.matchMedia('(prefers-color-scheme: dark)');
        const chosen = root.dataset.squiffyTheme;

        // A story that sets its own color-scheme doesn't change with the button, so hide it
        const schemeFor = function (theme) {
            root.dataset.squiffyTheme = theme;
            return getComputedStyle(root).colorScheme;
        };
        const fixed = schemeFor('light') === schemeFor('dark');
        if (chosen) root.dataset.squiffyTheme = chosen; else delete root.dataset.squiffyTheme;
        if (fixed) {
            button.hidden = true;
            return;
        }

        const current = function () {
            return root.dataset.squiffyTheme || (system.matches ? 'dark' : 'light');
        };
        const update = function () {
            const next = current() === 'dark' ? 'light' : 'dark';
            button.title = next === 'dark' ? button.dataset.switchToDark : button.dataset.switchToLight;
            button.setAttribute('aria-label', button.title);
            button.dataset.next = next;
        };
        button.addEventListener('click', function () {
            const theme = button.dataset.next;
            // Choosing the system's own setting goes back to following it
            const follow = theme === (system.matches ? 'dark' : 'light');
            if (follow) delete root.dataset.squiffyTheme; else root.dataset.squiffyTheme = theme;
            try {
                if (follow) localStorage.removeItem(key); else localStorage.setItem(key, theme);
            } catch (e) {
                // The choice just isn't remembered
            }
            update();
        });
        system.addEventListener('change', update);
        update();
    })();
</script>
</body>
</html>
