<!doctype html>
<html lang="en" data-theme="wintry">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Squiffy</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Write interactive stories in your browser with Squiffy." />
    <!-- Applies the stored Light/Dark/Match system theme before first paint: the same logic as
         theme-store.ts's applyTheme, run while the head is parsing so there's no flash of the
         wrong theme. -->
    <script>
        (function () {
            try {
                let pref = null;
                try {
                    pref = localStorage.getItem("squiffy-ui-theme");
                } catch {
                    pref = null;
                }
                if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
                const dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark", dark);
                document.documentElement.style.colorScheme = dark ? "dark" : "light";
            } catch {}
        })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" autocapitalize="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
