name: Publish to npm

# Publishes the public packages (compiler, runtime, packager, cli, types) when
# release-please tags a release. `lerna publish from-package` only publishes
# versions that aren't already on the registry, so re-running is safe.
#
# Authenticates with npm trusted publishing, not a token: each package's
# settings on npmjs.com trust this workflow file in textadventures/squiffy,
# and lerna exchanges the job's GitHub OIDC token for a short-lived publish
# token. It also attaches provenance, which needs each package.json's
# repository.url to match this repo.
on:
  push:
    tags: ['v*']
  # Manual escape hatch, e.g. to retry a failed publish. Dispatch
  # against the existing tag itself (`gh workflow run npm-publish.yml --ref
  # vX.Y.Z`) so GITHUB_REF_NAME below still resolves to that tag.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version ($FILE_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # An explicit dist-tag is needed: npm refuses to guess one for a
      # prerelease-looking version. Prereleases go to `beta`, so
      # `npx @textadventures/squiffy-cli` (what the docs tell people to run)
      # only ever gets a stable release.
      - name: Determine the dist-tag
        run: |
          if [ "$(.github/scripts/release-channel.sh "$GITHUB_REF_NAME")" == "stable" ]; then
            echo "DIST_TAG=latest" >> $GITHUB_ENV
          else
            echo "DIST_TAG=beta" >> $GITHUB_ENV
          fi

      # Retried because provenance signing is flaky: when Sigstore's
      # transparency log (Rekor) is slow, npm's client times out and retries
      # an upload that actually went through, gets a 409 "an equivalent entry
      # already exists" (TLOG_CREATE_ENTRY_ERROR), and fails. npm doesn't let
      # that be turned off. `from-package` skips versions that are already on
      # npm, so each try only publishes what's left. The pause gives the
      # registry time to show what the last try published, so it isn't
      # published again: that has taken around 4 minutes.
      #
      # lerna writes a gitHead field into each package.json while publishing
      # and only takes it out again when it succeeds. A failed try leaves the
      # tree dirty, and lerna then refuses to start the next one (EUNCOMMIT),
      # so the tracked files are reset before each retry. The build output
      # isn't tracked, so it's kept.
      - name: Publish to npm
        run: |
          for attempt in 1 2 3 4; do
            if npx lerna publish from-package --no-private --dist-tag "$DIST_TAG" --yes; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Publish attempt $attempt failed, retrying in 5 minutes"
              git status --short
              git checkout -- .
              sleep 300
            fi
          done
          echo "::error::Publish failed after 4 attempts"
          exit 1
