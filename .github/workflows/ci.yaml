name: Build, lint and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Fetch full history and tags
        run: |
          git fetch --prune --unshallow || true
          git fetch --tags --force

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The desktop app isn't one of the npm workspaces, so the editor's builds don't install
      # Electron. Its binary isn't needed to type-check and bundle it.
      - name: Build desktop app
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm run check
          npm run build

      # vite build doesn't type-check the editor, so svelte-check does
      - name: Type-check editor
        working-directory: app
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test