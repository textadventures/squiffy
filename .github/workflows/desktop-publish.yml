name: Publish desktop app

# Builds the desktop app (desktop/, #276) on macOS, Windows and Linux when a release tag is pushed
# (release-please merging its release PR), and attaches the installers to the GitHub Release that
# release-please has already created. Modelled on Quest Viva's electron-publish.yml. A prerelease
# is packaged as a separate app, "Squiffy Beta" (desktop/scripts/dist.mjs).
#
# macOS builds are signed with a Developer ID and notarized when the signing secrets are set
# (MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER), and
# signed ad hoc otherwise. Windows and Linux builds are unsigned.
#
# It also runs on pull requests that change the desktop app or this workflow, to check it still
# packages on every platform. Those builds are the beta, unsigned, and only kept as the run's
# artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop-publish.yml
  workflow_dispatch:
    inputs:
      channel:
        # A manual run builds the beta by default. Nothing is attached to a release either way:
        # the installers are the run's artifacts.
        description: Release channel to package
        type: choice
        options: [prerelease, stable]
        default: prerelease

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # gh release upload uses bash's brace expansion; upload-artifact needs a list
            release-glob: "*.dmg"
            artifact-path: desktop/release/*.dmg
          - os: windows-latest
            release-glob: "*.exe"
            artifact-path: desktop/release/*.exe
          - os: ubuntu-latest
            release-glob: "{*.AppImage,*.deb}"
            artifact-path: |
              desktop/release/*.AppImage
              desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Secrets can't be tested in an `if:` directly. Pull requests aren't signed or notarized.
      HAS_MAC_SIGNING: ${{ github.event_name != 'pull_request' && secrets.MAC_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match desktop/package.json's version ($VERSION)"
            exit 1
          fi

      - name: Decide the release channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$GITHUB_REF_TYPE" == "tag" ]; then
            CHANNEL="$(.github/scripts/release-channel.sh "$GITHUB_REF_NAME")"
          elif [ "$INPUT_CHANNEL" == "stable" ]; then
            CHANNEL=stable
          else
            CHANNEL=prerelease
          fi
          echo "RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          # Squiffy Beta's help links go to the beta docs, and its home page says it's the beta,
          # as on app-beta.squiffystory.com (deploy-app.yml)
          if [ "$CHANNEL" == "prerelease" ]; then
            echo "VITE_DOCS_URL=https://beta.squiffystory.com" >> "$GITHUB_ENV"
            echo "VITE_BETA_APP=true" >> "$GITHUB_ENV"
          fi
          echo "Channel: $CHANNEL"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the editor
        shell: bash
        run: |
          npm ci
          npx lerna run build --scope @textadventures/squiffy-app --include-dependencies

      - name: Write the Apple API key for notarization
        if: matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      - name: Import the Developer ID certificate into a signing keychain
        # As in Quest Viva's electron-publish.yml: electron-builder 26's own keychain setup passes
        # the wrong password to set-key-partition-list (electron-userland/electron-builder#10066),
        # so the keychain is made here and handed over with CSC_KEYCHAIN, with CSC_LINK unset.
        if: matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$MAC_CSC_LINK" | base64 -d > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock while signing and notarizing
          security set-keychain-settings -t 21600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Otherwise a failed import would quietly fall back to ad hoc signing
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES"
          if ! grep -q "Developer ID Application" <<< "$IDENTITIES"; then
            echo "::error::No 'Developer ID Application' identity after importing MAC_CSC_LINK"
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # electron-builder notarizes when these are set
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Package the desktop app
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run dist

      - name: Keep the installers as the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Attach the installers to the GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/release/${{ matrix.release-glob }} --clobber

      - name: Remove the signing keychain
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
