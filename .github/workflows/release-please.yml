name: release-please

# Maintains an up-to-date "release PR" that bumps every package's version and
# CHANGELOG.md from Conventional Commits-formatted PR titles merged to main.
# Merging that release PR is the release: this job tags it directly (e.g.
# v6.0.1), which in turn triggers npm-publish.yml and deploy-app.yml.
on:
  push:
    branches: [main]
  # Manual fallback for when a push to main didn't trigger a run (e.g. one
  # made with GITHUB_TOKEN), leaving the release PR out of date.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PAT rather than GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN
      # doesn't trigger other workflows, so npm-publish.yml would never run.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          sparse-checkout: .github/scripts

      # release-please creates every release as a normal (non-prerelease)
      # GitHub Release, since release-please-config.json no longer sets
      # prerelease: true. A prerelease cut with a `Release-As: X.Y.Z-beta.N`
      # footer is flagged as one here, which stops it holding "Latest" (and
      # matches npm-publish.yml's `beta` dist-tag), so Latest only ever points
      # at a stable release.
      - name: Mark the release stable or prerelease
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$(.github/scripts/release-channel.sh "$TAG")" == "stable" ]; then
            gh release edit "$TAG" --prerelease=false --latest --repo ${{ github.repository }}
          else
            gh release edit "$TAG" --prerelease=true --repo ${{ github.repository }}
          fi
