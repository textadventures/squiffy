name: Deploy app.squiffystory.com

# Deploys the editor (app/) to the squiffy-app Cloudflare Pages project when
# release-please tags a release, so app.squiffystory.com only ever runs a
# released version. Runs alongside npm-publish.yml off the same tag.
#
# squiffy-app is still connected to GitHub, for the preview deployments on
# PRs and pushes (its "Cloudflare Pages: squiffy-app" check is required on
# main), but its automatic production branch deployments are turned off in
# the Cloudflare dashboard. This workflow's upload of a stable release to
# --branch=main, the project's production branch, is what goes live.
on:
  push:
    tags: ['v*']
  # Manual escape hatch, e.g. to retry a failed deploy or roll back. Dispatch
  # against a release tag (`gh workflow run deploy-app.yml --ref vX.Y.Z`):
  # a run from a branch is refused, so production can't get an unreleased
  # build.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy anything but a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow against a release tag (gh workflow run deploy-app.yml --ref vX.Y.Z), not a branch."
          exit 1

      # Full history and tags, so the release channel and the tag check below
      # see the tag as it is
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version ($FILE_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # A prerelease goes to the `beta` preview branch
      # (beta.squiffy.pages.dev, served as app-beta.squiffystory.com)
      # rather than production, so app.squiffystory.com only ever runs a
      # stable release. Its Help menu links to the beta docs,
      # beta.squiffystory.com, which are built from main, and its home page
      # says it's the beta (VITE_BETA_APP).
      #
      # A stable release goes to the `beta` branch as well, unless a beta of
      # a later version is out already, so app-beta.squiffystory.com is never
      # older than app.squiffystory.com (#646): from 7.0.0 until 7.1.0-beta.1,
      # it runs 7.0.0. That build has VITE_BETA_APP, for its home page to say
      # there's no beta just now, but the stable docs, which match it.
      - name: Choose the Cloudflare Pages branch
        run: |
          if [ "$(.github/scripts/release-channel.sh "$GITHUB_REF_NAME")" == "stable" ]; then
            echo "PAGES_BRANCH=main" >> $GITHUB_ENV
            newer="$(.github/scripts/newer-prerelease.sh "$GITHUB_REF_NAME")"
            if [ -z "$newer" ]; then
              echo "ALSO_BETA=true" >> $GITHUB_ENV
            else
              echo "Not deploying to the beta too: $newer is newer."
            fi
          else
            echo "PAGES_BRANCH=beta" >> $GITHUB_ENV
            echo "VITE_DOCS_URL=https://beta.squiffystory.com" >> $GITHUB_ENV
            echo "VITE_BETA_APP=true" >> $GITHUB_ENV
          fi

      - name: Build the editor and the packages it uses
        run: npx lerna run build --scope @textadventures/squiffy-app --include-dependencies

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build --project-name=squiffy-app --branch=${{ env.PAGES_BRANCH }}

      # The packages it uses are built already
      - name: Build the editor again for the beta site
        if: env.ALSO_BETA == 'true'
        working-directory: app
        run: VITE_BETA_APP=true npm run build

      - name: Deploy to the beta site too
        if: env.ALSO_BETA == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build --project-name=squiffy-app --branch=beta
