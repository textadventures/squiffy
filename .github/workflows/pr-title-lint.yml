name: Lint PR title

# The PR title becomes the commit message release-please parses (PRs are
# squash-merged), and a commit without a Conventional Commits prefix (fix:,
# feat:, chore:, etc.) never triggers a release. This enforces the prefix
# only; scopes are not enforced.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
